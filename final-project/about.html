<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <meta name="description" content="About Us page for Find-A-Book with a reader spotlight and newsletter sign-up.">
    <meta name="author" content="Kelsey Hansel">
    <meta property="og:title" content="Find-A-Book About Us Page">
    <meta property="og:description" content="About Us page for Find-A-Book with a reader spotlight and newsletter sign-up.">
    <meta property="og:image" content="images/about-preview.jpg">
    <meta property="og:url" content="https://kelsey-hansel.github.io/wdd231/final-project/about.html">
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Felipa&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/date.js" defer></script>
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/reader-spotlight.js" defer></script>
</head>

<body>
    <header>
        <img src="images/find-a-book-logo.png" alt="book logo">
        <h1>Find-A-Book</h1>
        <a id="menu" href="#"></a>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Book List</a></li>
                <li><a href="about.html" class="active">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="form-page">
        <div>
            <h2>Newsletter Sign-Up</h2>
            <form id="newsletter-signup" method="GET" action="thankyou.html">
                <label for="first-name">First Name <input type="text" id="first-name" name="first-name" required
                        autocomplete="given-name" title="Please enter first name."> </label>
                <label for="last-name">Last Name <input type="text" id="last-name" name="last-name" required autocomplete="family-name"
                        title="Please enter last name."> </label>
                <label for="email">Email Address <input type="email" id="email" name="email" required autocomplete="email"
                        placeholder="youremail@website.com" title="Please enter your email."> </label>
                <label for="fav-genre">Favorite Genre <input type="text" id="fav-genre" name="fav-genre" required
                        title="Please enter your favorite genre."> </label>
                <label for="fav-author">Favorite Author <input type="text" id="fav-author" name="fav-author" required
                        title="Please enter your favorite author."> </label>
                <label for="submit-button"> <input type="submit" id="submit-button" name="submit-button"
                        value="Sign-Up"></label>
            </form>
        </div>
        <section id="reader-spotlight">
            <h2>Reader Spotlight</h2>
        </section>
    </main>
    <footer>
        <h4> Link to my <a href="https://youtu.be/ZwHuN_VfjZo">YouTube Demonstration</a> is here.</h4>
        <p>&copy;<span id="currentyear"></span> | Kelsey Hansel | Kansas, United States</p>
        <p class="last-mod">Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
