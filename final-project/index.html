<body>
    <header>
        <img src="images/find-a-book-logo.png" alt="book logo">
        <h1>Find-A-Book</h1>
        <a id="menu" href="#"></a>
        <nav>
            <ul class="navigation">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="directory.html">Book List</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="home">
        <section id="book-container">
            <h2>Indie Author Spotlight</h2>
        </section>
        <section id="blind-book">
            <h2>Book Blind Date</h2>
            <div id="blind-date">
                <p id="description"></p>
            </div>
            <button id="open-button"> Book Reveal </button>
            <dialog id="book-modal">
                <h4 id="title"></h4>
                <button id="close-button"> Close </button>
                <p id="author"></p>
                <p id="genre"></p>
                <p>Does it look interesting and worth a try?</p>
            </dialog>
        </section>
    </main>
    <footer>
